<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#081a15">

  <title>لوحة مالك حصنك</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #081a15;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
    }

    .card {
      background: #10251f;
      border: 1px solid #d5b86a55;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 15px 45px #0008;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #bfc8c4;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      height: 52px;
      border-radius: 13px;
      border: 1px solid #ffffff22;
      background: #081a15;
      color: white;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d5b86a;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: #d5b86a;
      color: #081a15;
      font-size: 16px;
      font-weight: bold;
      padding: 13px 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
    }

    .secondary {
      background: #ffffff12;
      color: white;
      border: 1px solid #ffffff20;
    }

    .danger {
      background: #8b3030;
      color: white;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #e8cfa0;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .suggestion {
      background: #081a15;
      border: 1px solid #ffffff18;
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
    }

    .suggestion.unread {
      border-color: #d5b86a99;
    }

    .suggestion-message {
      font-size: 17px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .suggestion-date {
      color: #8f9b96;
      font-size: 12px;
      margin-top: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      color: #aeb8b4;
      padding: 35px 10px;
    }

    .loading {
      text-align: center;
      color: #c8cfcc;
      padding: 30px;
    }

    .count {
      display: inline-block;
      margin-top: 5px;
      color: #d5b86a;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- =========================
       LOGIN
       ========================= -->

  <div id="loginBox" class="card">

    <h1>لوحة مالك حصنك</h1>

    <div class="subtitle">
      سجّل الدخول للوصول إلى اقتراحات وملاحظات الزوار.
    </div>

    <form id="loginForm">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        required
        placeholder="البريد الإلكتروني"
      >

      <label for="password">
        كلمة المرور
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="كلمة المرور"
      >

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        تسجيل الدخول
      </button>

      <div id="message"></div>

    </form>

  </div>


  <!-- =========================
       DASHBOARD
       ========================= -->

  <div id="dashboard" class="hidden">

    <div class="top">

      <div>
        <h1>اقتراحات وملاحظات</h1>

        <div class="subtitle">
          جميع الرسائل التي أرسلها زوار حصنك.
          <br>
          <span id="count" class="count"></span>
        </div>
      </div>

      <button
        id="logoutButton"
        class="secondary"
      >
        خروج
      </button>

    </div>

    <div id="suggestions"></div>

  </div>

</div>


<script>

  /* =========================
     Supabase
     ========================= */

  const SUPABASE_URL =
    "https://ggnpqhozioxzctrkmbgd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FEWSIWV7TDvQYfZT7rTzwg_oJuQ8t7s";


  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      }
    );


  /* =========================
     Elements
     ========================= */

  const loginBox =
    document.getElementById("loginBox");

  const dashboard =
    document.getElementById("dashboard");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  const suggestionsBox =
    document.getElementById("suggestions");

  const count =
    document.getElementById("count");

  const logoutButton =
    document.getElementById("logoutButton");


  /* =========================
     LOGIN
     ========================= */

  loginForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      loginButton.disabled = true;

      loginButton.textContent =
        "جارٍ تسجيل الدخول...";

      message.textContent = "";


      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      try {

        const result =
          await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (result.error) {

          console.error(
            "LOGIN ERROR:",
            result.error
          );

          message.textContent =
  "الخطأ: " + result.error.message;
  
  
          loginButton.disabled = false;

          loginButton.textContent =
            "تسجيل الدخول";

          return;
        }


        const session =
          result.data?.session;


        if (!session) {

          message.textContent =
            "تم تسجيل الدخول ولكن لم يتم إنشاء الجلسة.";

          loginButton.disabled = false;

          loginButton.textContent =
            "تسجيل الدخول";

          return;
        }


        /*
         * تم الدخول بنجاح.
         * نعرض لوحة المالك مباشرة
         * بدون إعادة تحميل الصفحة.
         */

        await showDashboard(
          session
        );

      } catch (error) {

        console.error(
          "LOGIN EXCEPTION:",
          error
        );

        message.textContent =
          "حدث خطأ أثناء تسجيل الدخول.";

        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";
      }

    }
  );


  /* =========================
     SHOW DASHBOARD
     ========================= */

  async function showDashboard(session) {

    loginBox.classList.add("hidden");

    dashboard.classList.remove("hidden");

    suggestionsBox.innerHTML =
      '<div class="card loading">جارٍ تحميل الاقتراحات...</div>';

    count.textContent = "";


    /*
     * نستخدم الـ access token للجلسة
     * مباشرة في طلب Supabase.
     */

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/suggestions" +
        "?select=id,message,created_at,is_read" +
        "&order=created_at.desc",
        {
          method: "GET",

          headers: {
            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              session.access_token
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "SUGGESTIONS ERROR:",
        errorText
      );

      suggestionsBox.innerHTML =
        `
        <div class="card">
          تعذر تحميل الاقتراحات.
          <br><br>
          تأكد من صلاحيات حساب المالك.
        </div>
        `;

      return;
    }


    const data =
      await response.json();


    count.textContent =
      `عدد الاقتراحات: ${data.length}`;


    if (
      !data ||
      data.length === 0
    ) {

      suggestionsBox.innerHTML =
        '<div class="card empty">لا توجد اقتراحات حتى الآن.</div>';

      return;
    }


    suggestionsBox.innerHTML =
      data
        .map(
          function (item) {

            const date =
              new Date(
                item.created_at
              ).toLocaleString(
                "ar-SA",
                {
                  dateStyle: "medium",
                  timeStyle: "short"
                }
              );


            return `
              <div
                class="suggestion ${
                  item.is_read
                    ? ""
                    : "unread"
                }"
              >

                <div class="suggestion-message">
                  ${escapeHtml(
                    item.message
                  )}
                </div>

                <div class="suggestion-date">
                  ${date}
                </div>

                <div class="actions">

                  ${
                    item.is_read
                      ? ""
                      : `
                        <button
                          onclick="markRead('${item.id}')"
                        >
                          تحديد كمقروء
                        </button>
                      `
                  }

                  <button
                    class="danger"
                    onclick="deleteSuggestion('${item.id}')"
                  >
                    حذف
                  </button>

                </div>

              </div>
            `;
          }
        )
        .join("");
  }


  /* =========================
     MARK AS READ
     ========================= */

  window.markRead =
    async function (id) {

      const {
        data
      } =
        await supabase.auth.getSession();


      const session =
        data?.session;


      if (!session) {

        alert(
          "انتهت جلسة الدخول. سجّل الدخول مرة أخرى."
        );

        showLogin();

        return;
      }


      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/suggestions?id=eq." +
          encodeURIComponent(id),
          {
            method: "PATCH",

            headers: {
              apikey:
                SUPABASE_KEY,

              Authorization:
                "Bearer " +
                session.access_token,

              "Content-Type":
                "application/json",

              Prefer:
                "return=minimal"
            },

            body: JSON.stringify({
              is_read: true
            })
          }
        );


      if (!response.ok) {

        alert(
          "تعذر تحديد الاقتراح كمقروء."
        );

        return;
      }


      await showDashboard(
        session
      );
    };


  /* =========================
     DELETE
     ========================= */

  window.deleteSuggestion =
    async function (id) {

      const confirmed =
        confirm(
          "هل تريد حذف هذا الاقتراح؟"
        );


      if (!confirmed) {
        return;
      }


      const {
        data
      } =
        await supabase.auth.getSession();


      const session =
        data?.session;


      if (!session) {

        alert(
          "انتهت جلسة الدخول."
        );

        showLogin();

        return;
      }


      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/suggestions?id=eq." +
          encodeURIComponent(id),
          {
            method: "DELETE",

            headers: {
              apikey:
                SUPABASE_KEY,

              Authorization:
                "Bearer " +
                session.access_token
            }
          }
        );


      if (!response.ok) {

        alert(
          "تعذر حذف الاقتراح."
        );

        return;
      }


      await showDashboard(
        session
      );
    };


  /* =========================
     LOGOUT
     ========================= */

  logoutButton.addEventListener(
    "click",
    async function () {

      await supabase.auth.signOut();

      showLogin();

    }
  );


  /* =========================
     SHOW LOGIN
     ========================= */

  function showLogin() {

    dashboard.classList.add(
      "hidden"
    );

    loginBox.classList.remove(
      "hidden"
    );

    loginButton.disabled =
      false;

    loginButton.textContent =
      "تسجيل الدخول";

    message.textContent = "";

    document
      .getElementById("password")
      .value = "";

  }


  /* =========================
     SECURITY
     ========================= */

  function escapeHtml(text) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      text;

    return div.innerHTML;
  }


  /* =========================
     CHECK EXISTING SESSION
     ========================= */

  (async function () {

    try {

      const {
        data,
        error
      } =
        await supabase.auth.getSession();


      if (
        !error &&
        data?.session
      ) {

        await showDashboard(
          data.session
        );

      }

    } catch (error) {

      console.error(
        "SESSION ERROR:",
        error
      );

    }

  })();

</script>

</body>
</html>
