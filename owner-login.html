<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#081a15">

  <title>لوحة مالك حصنك</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #081a15;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 35px auto;
    }

    .card {
      background: #10251f;
      border: 1px solid #d5b86a55;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 15px 45px #0008;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #bfc8c4;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      height: 52px;
      border-radius: 13px;
      border: 1px solid #ffffff22;
      background: #081a15;
      color: white;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d5b86a;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: #d5b86a;
      color: #081a15;
      font-size: 16px;
      font-weight: bold;
      padding: 13px 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
    }

    .secondary {
      background: #ffffff12;
      color: white;
      border: 1px solid #ffffff20;
    }

    .danger {
      background: #8b3030;
      color: white;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #e8cfa0;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .suggestion {
      background: #081a15;
      border: 1px solid #ffffff18;
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
    }

    .suggestion.unread {
      border-color: #d5b86a99;
    }

    .suggestion-message {
      font-size: 17px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .suggestion-date {
      color: #8f9b96;
      font-size: 12px;
      margin-top: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .empty,
    .loading {
      text-align: center;
      color: #aeb8b4;
      padding: 35px 10px;
    }

    .count {
      color: #d5b86a;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- تسجيل الدخول -->
  <div id="loginBox" class="card">

    <h1>لوحة مالك حصنك</h1>

    <div class="subtitle">
      سجّل الدخول للوصول إلى اقتراحات وملاحظات الزوار.
    </div>

    <form id="loginForm">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        required
        placeholder="البريد الإلكتروني"
      >

      <label for="password">
        كلمة المرور
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="كلمة المرور"
      >

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        تسجيل الدخول
      </button>

      <div id="message"></div>

    </form>

  </div>


  <!-- لوحة المالك -->
  <div id="dashboard" class="hidden">

    <div class="top">

      <div>
        <h1>اقتراحات وملاحظات</h1>

        <div class="subtitle">
          جميع الرسائل التي أرسلها زوار حصنك.
          <br>
          <span id="count" class="count"></span>
        </div>
      </div>

      <button
        id="logoutButton"
        class="secondary"
      >
        خروج
      </button>

    </div>

    <div id="suggestions"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://ggnpqhozioxzctrkmbgd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_FEWSIWV7TDvQYfZT7rTzwg_oJuQ8t7s";


const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");

const suggestionsBox =
  document.getElementById("suggestions");

const count =
  document.getElementById("count");

const logoutButton =
  document.getElementById("logoutButton");


/* =================================
   تسجيل الدخول مباشرة مع Supabase
   ================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginButton.disabled = true;

    loginButton.textContent =
      "جارٍ تسجيل الدخول...";

    message.textContent = "";


    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/auth/v1/token?grant_type=password",
          {
            method: "POST",

            headers: {
              apikey:
                SUPABASE_KEY,

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        message.textContent =
          "الخطأ: " +
          (
            result.error_description ||
            result.msg ||
            result.message ||
            "تعذر تسجيل الدخول"
          );

        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";

        return;
      }


      if (!result.access_token) {

        message.textContent =
          "تم الدخول ولكن لم يتم إنشاء الجلسة.";

        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";

        return;
      }


      /*
       * حفظ جلسة المالك
       */

      localStorage.setItem(
        "hosnek_owner_access_token",
        result.access_token
      );

      if (result.refresh_token) {

        localStorage.setItem(
          "hosnek_owner_refresh_token",
          result.refresh_token
        );

      }


      /*
       * تحميل لوحة المالك
       */

      await loadDashboard(
        result.access_token
      );

    } catch(error) {

      console.error(error);

      message.textContent =
        "حدث خطأ في الاتصال بسيرفر Supabase.";

      loginButton.disabled = false;

      loginButton.textContent =
        "تسجيل الدخول";

    }

  }
);


/* =================================
   تحميل الاقتراحات
   ================================= */

async function loadDashboard(
  accessToken
) {

  loginBox.classList.add(
    "hidden"
  );

  dashboard.classList.remove(
    "hidden"
  );

  suggestionsBox.innerHTML =
    '<div class="card loading">جارٍ تحميل الاقتراحات...</div>';


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/suggestions" +
      "?select=id,message,created_at,is_read" +
      "&order=created_at.desc",
      {
        method: "GET",

        headers: {
          apikey:
            SUPABASE_KEY,

          Authorization:
            "Bearer " +
            accessToken
        }
      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    console.error(
      "Suggestions error:",
      error
    );

    suggestionsBox.innerHTML =
      `
      <div class="card">
        <div>
          تعذر تحميل الاقتراحات.
        </div>
        <br>
        <div style="font-size:13px;color:#999;">
          تأكد من صلاحيات حساب المالك.
        </div>
      </div>
      `;

    return;
  }


  const data =
    await response.json();


  count.textContent =
    "عدد الاقتراحات: " +
    data.length;


  if (
    !data ||
    data.length === 0
  ) {

    suggestionsBox.innerHTML =
      '<div class="card empty">لا توجد اقتراحات حتى الآن.</div>';

    return;
  }


  suggestionsBox.innerHTML =
    data
      .map(
        function(item) {

          const date =
            new Date(
              item.created_at
            ).toLocaleString(
              "ar-SA",
              {
                dateStyle:
                  "medium",

                timeStyle:
                  "short"
              }
            );


          return `
            <div
              class="suggestion ${
                item.is_read
                  ? ""
                  : "unread"
              }"
            >

              <div class="suggestion-message">
                ${escapeHtml(
