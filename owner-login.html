<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#081a15">

  <title>مالك حصنك</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #081a15;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 40px auto;
    }

    .card {
      background: #10251f;
      border: 1px solid #d5b86a55;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 15px 45px #0008;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      color: #bfc8c4;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
    }

    input {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: 1px solid #ffffff22;
      background: #081a15;
      color: white;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d5b86a;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: #d5b86a;
      color: #081a15;
      font-size: 16px;
      font-weight: bold;
      padding: 13px 18px;
      cursor: pointer;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
    }

    button.secondary {
      background: #ffffff12;
      color: white;
      border: 1px solid #ffffff20;
    }

    button.danger {
      background: #8b3030;
      color: white;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #e8cfa0;
    }

    .hidden {
      display: none !important;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .suggestion {
      background: #081a15;
      border: 1px solid #ffffff15;
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
    }

    .suggestion.unread {
      border-color: #d5b86a88;
    }

    .suggestion-message {
      font-size: 16px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .suggestion-date {
      color: #8f9b96;
      font-size: 12px;
      margin-top: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      color: #aeb8b4;
      padding: 35px 10px;
    }

    .loading {
      text-align: center;
      color: #c8cfcc;
      padding: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h1>لوحة مالك حصنك</h1>

    <div class="subtitle">
      سجّل الدخول للوصول إلى اقتراحات وملاحظات الزوار.
    </div>

    <form id="loginForm">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
        placeholder="البريد الإلكتروني"
      >

      <label for="password">
        كلمة المرور
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="كلمة المرور"
      >

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        تسجيل الدخول
      </button>

      <div id="message"></div>

    </form>

  </div>


  <!-- OWNER DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="top">

      <div>
        <h1>اقتراحات وملاحظات</h1>

        <div class="subtitle">
          هنا تظهر الرسائل التي يرسلها زوار حصنك.
        </div>
      </div>

      <button
        id="logoutButton"
        class="secondary"
      >
        خروج
      </button>

    </div>

    <div id="suggestions"></div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://ggnpqhozioxzctrkmbgd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FEWSIWV7TDvQYfZT7rTzwg_oJuQ8t7s";


  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const loginBox =
    document.getElementById("loginBox");

  const dashboard =
    document.getElementById("dashboard");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  const suggestionsBox =
    document.getElementById("suggestions");

  const logoutButton =
    document.getElementById("logoutButton");


  /* =========================
     عرض لوحة المالك
     ========================= */

  async function loadDashboard() {

    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");

    suggestionsBox.innerHTML =
      '<div class="card loading">جارٍ تحميل الاقتراحات...</div>';


    const {
      data: sessionData
    } =
      await supabase.auth.getSession();


    const session =
      sessionData?.session;


    if (!session) {
      showLogin();
      return;
    }


    const user =
      session.user;


    if (
      user?.app_metadata?.role !==
      "admin"
    ) {

      await supabase.auth.signOut();

      showLogin();

      message.textContent =
        "هذا الحساب غير مصرح له بالدخول.";

      return;
    }


    const {
      data,
      error
    } =
      await supabase
        .from("suggestions")
        .select(
          "id,message,created_at,is_read"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      suggestionsBox.innerHTML =
        '<div class="card">تعذر تحميل الاقتراحات.</div>';

      console.error(error);

      return;
    }


    if (!data || data.length === 0) {

      suggestionsBox.innerHTML =
        '<div class="card empty">لا توجد اقتراحات حتى الآن.</div>';

      return;
    }


    suggestionsBox.innerHTML =
      data
        .map(
          (item) => {

            const date =
              new Date(
                item.created_at
              ).toLocaleString(
                "ar-SA",
                {
                  dateStyle: "medium",
                  timeStyle: "short"
                }
              );


            return `
              <div
                class="suggestion ${
                  item.is_read
                    ? ""
                    : "unread"
                }"
                data-id="${item.id}"
              >

                <div class="suggestion-message">
                  ${escapeHtml(item.message)}
                </div>

                <div class="suggestion-date">
                  ${date}
                </div>

                <div class="actions">

                  ${
                    item.is_read
                      ? ""
                      : `
                        <button
                          onclick="markRead('${item.id}')"
                        >
                          تحديد كمقروء
                        </button>
                      `
                  }

                  <button
                    class="danger"
                    onclick="deleteSuggestion('${item.id}')"
                  >
                    حذف
                  </button>

                </div>

              </div>
            `;
          }
        )
        .join("");
  }


  /* =========================
     تسجيل الدخول
     ========================= */

  loginForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      loginButton.disabled = true;

      loginButton.textContent =
        "جارٍ تسجيل الدخول...";

      message.textContent = "";


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const {
        data,
        error
      } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        message.textContent =
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";

        return;
      }


      const role =
        data?.user?.app_metadata?.role;


      if (role !== "admin") {

        await supabase.auth.signOut();

        message.textContent =
          "هذا الحساب غير مصرح له بالدخول.";

        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";

        return;
      }


      await loadDashboard();

    }
  );


  /* =========================
     تحديد كمقروء
     ========================= */

  window.markRead =
    async function (id) {

      const {
        error
      } =
        await supabase
          .from("suggestions")
          .update({
            is_read: true
          })
          .eq(
            "id",
            id
          );


      if (error) {

        alert(
          "تعذر تحديث الاقتراح."
        );

        return;
      }


      await loadDashboard();
    };


  /* =========================
     حذف
     ========================= */

  window.deleteSuggestion =
    async function (id) {

      if (
        !confirm(
          "هل تريد حذف هذا الاقتراح؟"
        )
      ) {
        return;
      }


      const {
        error
      } =
        await supabase
          .from("suggestions")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        alert(
          "تعذر حذف الاقتراح."
        );

        return;
      }


      await loadDashboard();
    };


  /* =========================
     تسجيل الخروج
     ========================= */

  logoutButton.addEventListener(
    "click",
    async function () {

      await supabase.auth.signOut();

      showLogin();

    }
  );


  function showLogin() {

    dashboard.classList.add("hidden");

    loginBox.classList.remove("hidden");

    loginButton.disabled = false;

    loginButton.textContent =
      "تسجيل الدخول";

  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;
  }


  /* =========================
     عند فتح الصفحة
     ========================= */

  (async function () {

    const {
      data
    } =
      await supabase.auth.getSession();


    if (data?.session) {

      await loadDashboard();

    }

  })();

</script>

</body>
</html>
